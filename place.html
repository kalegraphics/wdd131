<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nigeria country page for WDD 131 assignment">
    <meta name="author" content="Adeshina Kalejaiye">

    <title>Nigeria | WDD131</title>

    <link rel="stylesheet" href="styles/place.css">

    <script src="scripts/place.js" defer></script>
</head>
<body>

    <header>
        <h1>Nigeria</h1>
    </header>

    <main>

        <picture>
            <source srcset="images/nigeria2.jpg" media="(min-width: 768px)">
            <img src="images/nigeriasmall.jpg" alt="Beautiful view of Nigeria" class="hero-image">
        </picture>

        <section class="card data">
            <h2>Data</h2>

            <p><strong>Area:</strong> 923,768 sq km</p>
            <p><strong>Population:</strong> 223 Million</p>
            <p><strong>Capital:</strong> Abuja</p>
            <p><strong>Languages:</strong> English, Yoruba, Hausa, Igbo</p>
            <p><strong>Currency:</strong> Naira</p>
            <p><strong>Time Zone:</strong> WAT</p>
            <p><strong>Calling Code:</strong> +234</p>
            <p><strong>Internet TLD:</strong> .ng</p>
        </section>

        <section class="card weather">
            <h2>Weather</h2>

            <img src="images/weather.svg" alt="Weather Icon" class="weather-icon">

            <p><strong>Temperature:</strong> <span id="temp">8</span>°C</p>
            <p><strong>Conditions:</strong> Cloudy</p>
            <p><strong>Wind:</strong> <span id="wind">10</span> km/h</p>
            <p><strong>Wind Chill:</strong> <span id="windchill"></span></p>
        </section>

    </main>

    <footer>
        <p>
            © <span id="currentyear"></span> | Adeshina Kalejaiye | Nigeria
        </p>

        <p id="lastModified"></p>
    </footer>

</body>
</html>
